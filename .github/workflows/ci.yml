name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — install + test + build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npx vitest run --reporter=verbose
        env:
          # Vitest needs a minimal Firebase env to not crash on import
          VITE_FIREBASE_API_KEY:             test
          VITE_FIREBASE_AUTH_DOMAIN:         test.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID:          test
          VITE_FIREBASE_STORAGE_BUCKET:      test.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID:              1:000000000000:web:test
          VITE_API_URL:                      http://localhost:5000

      - name: Vite production build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY:             ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:         ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:          ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:      ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:              ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_URL:                      ${{ secrets.VITE_API_URL }}

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    name: Backend — install + lint + test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate problem folders
        run: node scripts/importProblems.js --dry-run

      - name: Run backend tests
        run: npm test -- --reporter=verbose
        env:
          NODE_ENV: test
          # No MongoDB/Firebase needed — tests mock Mongoose models and
          # external calls directly (see backend/test/README.md) rather
          # than hitting a real database or Firebase project.
          MONGODB_URI: ""
          FIREBASE_PROJECT_ID:  test
          FIREBASE_CLIENT_EMAIL: test@test.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY:  "-----BEGIN RSA PRIVATE KEY-----\nMIItest\n-----END RSA PRIVATE KEY-----\n"
        # `continue-on-error` removed — backend tests now exist (see
        # backend/test/README.md and the *.test.js files alongside the
        # modules they cover), so a failing one should fail the pipeline
        # like any other CI check, not be silently ignored.
